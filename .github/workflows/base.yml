name: Validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Record source and lock identity
        run: |
          git rev-parse HEAD
          shasum -a 256 bun.lock
          node --version
          bun --version
      - name: Account-free frozen installation
        run: |
          install_home=$(mktemp -d)
          install_cache=$(mktemp -d)
          env -i HOME="$install_home" PATH="$PATH" BUN_INSTALL_CACHE_DIR="$install_cache" BUN_CONFIG_NO_GLOBAL=true bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Clean isolated base validation without OMO
        run: |
          test ! -e "$HOME/.local/bin/omo"
          bun run validate:base
      - run: bun run check:docs
      - name: Real npm tarball and clean npm/Bun consumers
        run: bun run test:packaging
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Acquire a checksum-verified, account-free test host
        run: bun run prepare:host
      - run: bun run validate:native
      - name: Real-host source and packed-extension acceptance
        run: |
          bun run test:tui
          TUI_COLS=18 TUI_ROWS=8 TUI_THEME=light bun run test:package-host

  publish:
    needs: [base, native]
    if: github.repository == 'GodCC6/omo-route-panel' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compare package version with the npm registry
        id: version
        run: |
          local=$(node -p "require('./package.json').version")
          published=$(npm view omo-route-panel version)
          echo "version=$local" >> "$GITHUB_OUTPUT"
          relation=$(node -p "const [a,b]=process.argv.slice(1).map(v=>v.split('.').map(Number));(a[0]-b[0])||(a[1]-b[1])||(a[2]-b[2])" "$published" "$local")
          if [ "$relation" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $local is already published; nothing to release."
          elif [ "$relation" -gt 0 ]; then
            echo "::error::package.json version $local is not newer than the published version $published."
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Preparing release $local over published $published."
          fi
      - name: Pack the release tarball
        if: steps.version.outputs.skip == 'false'
        run: bun run pack
      - name: Publish the tested tarball through trusted publishing
        if: steps.version.outputs.skip == 'false'
        run: npm publish "artifacts/omo-route-panel-${{ steps.version.outputs.version }}.tgz" --ignore-scripts --access public
      - name: Tag the released version
        if: steps.version.outputs.skip == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
