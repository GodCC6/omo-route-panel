name: npm staging
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the verified tarball using OIDC; a maintainer must separately approve publication
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check package and source identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run validate:base
      - run: bun run prepare:host
      - run: bun run validate:native
      - name: Verify and retain the exact tarball for publication
        env:
          OMO_PACKAGE_OUTPUT_DIR: artifacts
        run: bun run test:package-host
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
  stage:
    if: ${{ inputs.stage }}
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: 26.11.1
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Stage the already verified bytes without approving publication
        run: node scripts/stage-release.mjs artifacts/*.tgz
